
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share My Location</title>
</head>
<body style="font-family:Arial;max-width:500px;margin:40px auto;padding:20px">
  <h2>Share Your Location</h2>
  <p>
    Press the button to get your location.
    You can then choose whether to share it with someone.
  </p>

  <button id="share">Get and Share Location</button>
  <p id="status" aria-live="polite"></p>

  <script>
    const button = document.getElementById("share");
    const status = document.getElementById("status");

    button.onclick = () => {
      if (!navigator.geolocation) {
        status.textContent = "Location is not supported.";
        return;
      }

      button.disabled = true;
      status.textContent = "Waiting for location permission...";

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const mapLink =
          `https://maps.google.com/?q=${lat},${lon}`;

        const message = `I chose to share my location: ${mapLink}`;

        try {
          if (navigator.share) {
            await navigator.share({
              title: "My shared location",
              text: message
            });
            status.textContent = "Sharing options opened.";
          } else {
            await navigator.clipboard.writeText(message);
            status.textContent =
              "Location link copied. You can paste it into WhatsApp.";
          }
        } catch (e) {
          status.textContent =
            "Sharing cancelled or unavailable. You can try again.";
        }

        button.disabled = false;
      }, (err) => {
        status.textContent =
          err.code === 1
            ? "Location permission was denied."
            : "Location unavailable. Check GPS and try again.";
        button.disabled = false;
      }, {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      });
    };
  </script>
</body>
</html>
