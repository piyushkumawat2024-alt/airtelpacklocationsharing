
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Sharing</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:500px;margin:50px auto;padding:20px;line-height:1.6">

  <h2>Share Your Location</h2>

  <p>
    If you choose to continue, your browser will ask
    permission to access your device's location.
    Your coordinates will be displayed on this page.
  </p>

  <button id="share" style="padding:12px 18px;cursor:pointer">
    Share my location
  </button>

  <p id="status" role="status" aria-live="polite"></p>
  <div id="result"></div>

  <script>
    const button = document.getElementById("share");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    button.addEventListener("click", () => {
      result.replaceChildren();

      if (!navigator.geolocation) {
        status.textContent = "Location is not supported by this browser.";
        return;
      }

      status.textContent = "Waiting for your permission...";
      button.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);

          status.textContent = "Location obtained.";
          const details = document.createElement("p");
          details.textContent =
            `Latitude: ${lat}; Longitude: ${lon}; Accuracy: approximately ${accuracy} metres.`;

          const map = document.createElement("a");
          map.href = `https://www.google.com/maps?q=${lat},${lon}`;
          map.textContent = "View location on Google Maps";
          map.target = "_blank";
          map.rel = "noopener noreferrer";

          result.append(details, map);
          button.disabled = false;
        },
        (error) => {
          const messages = {
            1: "Permission was denied. Allow location access if you wish to share it.",
            2: "Location is currently unavailable. Check your GPS and settings.",
            3: "Request timed out. Please try again."
          };

          status.textContent =
            messages[error.code] || "Could not obtain location.";
          button.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 25000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
